[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.pornhub.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.archive.org https://*.wikimedia.org https://*.phncdn.com; media-src 'self' https://*.archive.org https://*.wikimedia.org; connect-src 'self'"
